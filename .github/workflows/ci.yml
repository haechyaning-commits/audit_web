name: CI

# 2026-08-24(피드백 반영): 최소 버전 CI — 커밋/PR마다 "최소한 빌드는 되는지" 자동 확인.
# 백엔드는 torch/sentence-transformers처럼 무거운 의존성 설치 + 실 DB 연결이 필요해서
# 여기선(GitHub Actions 무료 러너, 시간 제한) 문법 체크만 함 — 실제 동작 검증(TestClient
# 등)은 별도 작업으로 남겨둠. 지금은 "빌드 깨진 채로 커밋되는 것"만 막는 게 목표.
#
# 2026-08-27: splitIntoBlocks() Vitest 유닛테스트(frontend/src/pages/splitIntoBlocks.test.js,
# PR #46)를 추가했는데 정작 이 워크플로에 npm run test가 없어서 CI가 초록불이어도 테스트가
# 실제로 돌아간다는 보장이 없었음(로컬에서만 수동 실행) — lint/build 사이에 추가해서
# 앞으로 이 파싱 로직에 회귀가 생기면 CI가 바로 잡아내게 함.
#
# 2026-08-27(2차): backend-test 잡 신규 추가 — /reports, /admin/reports 같은 입력검증/
# 인가 로직도 지금까지 py_compile(문법 체크)뿐이라 실제 동작은 전혀 검증 안 되고
# 있었음. 위 주석의 "무거운 의존성"은 torch/sentence-transformers(임베딩 모델)
# 얘기인데, app/embedding.py가 그 import를 load_model() 함수 안으로 옮기도록
# 리팩터링해서(app.embedding 모듈 자체는 이제 가벼움) 모델이 필요 없는 라우트는
# torch 설치 없이도 테스트 가능해짐 — backend/requirements-test.txt 주석 참고.
# DATABASE_URL/ADMIN_TOKEN은 backend/tests/conftest.py가 테스트 전용 값으로
# 채워서 실제 프로덕션 DB 연결 없이 동작함(TestClient가 lifespan을 안 태우므로
# db.init_pool()도 실제로는 호출 안 됨).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile backend/app/*.py scripts/*.py

  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: pytest
