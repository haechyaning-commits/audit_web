name: CI

# 2026-08-24(피드백 반영): 최소 버전 CI — 커밋/PR마다 "최소한 빌드는 되는지" 자동 확인.
# 백엔드는 torch/sentence-transformers처럼 무거운 의존성 설치 + 실 DB 연결이 필요해서
# 여기선(GitHub Actions 무료 러너, 시간 제한) 문법 체크만 함 — 실제 동작 검증(TestClient
# 등)은 별도 작업으로 남겨둠. 지금은 "빌드 깨진 채로 커밋되는 것"만 막는 게 목표.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile backend/app/*.py scripts/*.py
